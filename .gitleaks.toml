# gitleaks: default ruleset plus the token shapes this harness actually handles.
[extend]
useDefault = true

[[rules]]
id = "supabase-access-token"
description = "Supabase personal access token"
regex = '''sbp_[A-Za-z0-9]{20,}'''
keywords = ["sbp_"]

[[rules]]
id = "vercel-token"
description = "Vercel access token"
regex = '''vc[pk]_[A-Za-z0-9]{20,}'''
keywords = ["vcp_", "vck_"]

[allowlist]
description = "Documented placeholders"
regexes = ['''REDACTED''', '''your-token-here''']
